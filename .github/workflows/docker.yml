name: Docker
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Builds the production images and boots the stack from docker-compose.prod.yml, as a
  # deployment would: migrations, the runtime role, then every health check.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.production
    steps:
      - uses: actions/checkout@v4

      - name: Write a throwaway production env file
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          POSTGRES_PASSWORD=ci-owner-password
          WEB_URL=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:4000
          API_PUBLIC_URL=http://localhost:4000
          DATABASE_URL=postgresql://wacrm_app:ci-app-password@postgres:5432/wacrm
          DIRECT_URL=postgresql://wacrm:ci-owner-password@postgres:5432/wacrm
          REDIS_URL=redis://redis:6379
          JWT_ACCESS_SECRET=$(openssl rand -hex 32)
          JWT_REFRESH_SECRET=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          META_APP_ID=ci
          META_APP_SECRET=ci-secret
          META_WEBHOOK_VERIFY_TOKEN=ci-verify-token
          S3_ENDPOINT=http://s3.invalid:9000
          S3_BUCKET=ci
          S3_REGION=auto
          S3_ACCESS_KEY_ID=ci
          S3_SECRET_ACCESS_KEY=ci-secret
          SMTP_URL=smtp://mail.invalid:25
          MAIL_FROM="CI <ci@example.com>"
          EOF

      - name: Build images
        run: $COMPOSE --profile tools build

      - name: Start the database and Redis
        run: $COMPOSE up -d --wait postgres redis

      - name: Migrate and create the runtime role
        run: |
          $COMPOSE run --rm tools
          $COMPOSE exec -T postgres psql -U wacrm -d wacrm -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE wacrm_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS IN ROLE app_user;"

      - name: Start api, worker and web
        run: $COMPOSE up -d --wait --wait-timeout 180 api worker web

      - name: Health checks
        run: |
          curl -fsS http://localhost:4000/health/ready && echo
          curl -fsS http://localhost:3000/health && echo
          $COMPOSE exec -T worker node -e "fetch('http://127.0.0.1:4001/health').then(r=>r.text()).then(console.log)"

      - name: Logs
        if: always()
        run: $COMPOSE logs --no-color --tail 200 api worker web
