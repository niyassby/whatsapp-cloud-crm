services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wacrm
      POSTGRES_PASSWORD: wacrm
      POSTGRES_DB: wacrm
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wacrm']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redisdata:/data]
  # Local S3-compatible storage. MinIO no longer publishes free images, so SeaweedFS is used.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['9000:8333']
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  pgdata:
  redisdata:
  s3data:
